[project]
name = "cleanupbench"
version = "0.1.0"
description = "Cleanup Bench: a public benchmark for dictation cleanup (raw transcript in, cleaned text out)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abhi Ram Salammagari", email = "abhiram.304@gmail.com" }]
dependencies = [
    "jsonschema>=4.23",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.21",
    "huggingface-hub>=0.26",
]

[project.scripts]
cleanupbench = "cleanupbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cleanupbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
