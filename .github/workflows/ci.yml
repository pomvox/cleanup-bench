name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.9.5"
      - name: Install
        run: uv sync --locked --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit and schema tests
        run: uv run pytest
      - name: Validate items and run folders
        run: uv run cleanupbench validate
      - name: Recompute every committed scores.json and compare
        run: uv run cleanupbench score --check
      - name: Regenerate the site and compare with the committed one
        run: uv run cleanupbench report --check
